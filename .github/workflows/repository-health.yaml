name: Repository Health Check
# Automated repository health monitoring and issue creation
# Features:
# - Detects change types (security, policy, code, config, docs)
# - Auto-creates required labels if missing
# - Creates issues for changes to main/development branches
# - Validates repository structure and content
on:
  push:
    branches: [main, development]
  pull_request:
    types: [opened, synchronize]

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive review
          
      - name: Ensure Required Labels Exist
        run: |
          # Define all labels used by this workflow
          declare -A LABELS=(
            ["automated-review"]="0369f7,Automated code review generated by workflow"
            ["copilot"]="7057ff,GitHub Copilot or AI-assisted changes"
            ["security-review"]="d93f0b,Security-related changes requiring review"
            ["urgent"]="b60205,High priority requiring immediate attention"
            ["policy-review"]="0052cc,Policy or compliance changes requiring review"
            ["compliance"]="0e8a16,Compliance or regulatory requirements"
            ["production-branch"]="d4c5f9,Changes to production branch"
            ["development-branch"]="c5def5,Changes to development branch"
            ["health-issues"]="fef2c0,Repository health check detected issues"
          )
          
          # Get existing labels
          EXISTING_LABELS=$(gh label list --json name --jq '.[].name' || echo "")
          
          # Create missing labels
          for label_name in "${!LABELS[@]}"; do
            if ! echo "$EXISTING_LABELS" | grep -q "^${label_name}$"; then
              IFS=',' read -r color description <<< "${LABELS[$label_name]}"
              echo "Creating label: $label_name"
              gh label create "$label_name" --color "$color" --description "$description" || true
            else
              echo "Label exists: $label_name"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          
      - name: Detect Change Types
        id: detect-changes
        run: |
          # Detect what types of files changed
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only origin/main HEAD 2>/dev/null || echo "")
          
          # Analyze change patterns
          SECURITY_CHANGES="false"
          POLICY_CHANGES="false" 
          CODE_CHANGES="false"
          CONFIG_CHANGES="false"
          DOCS_CHANGES="false"
          
          if echo "$CHANGED_FILES" | grep -E "(docs/policy/|\.md.*security|auth|jwt|token)" > /dev/null; then
            SECURITY_CHANGES="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -E "docs/policy/" > /dev/null; then
            POLICY_CHANGES="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -E "\.(cs|js|ts|tsx|jsx|py|java|go)$" > /dev/null; then
            CODE_CHANGES="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -E "\.(json|yaml|yml|xml|config|env)$" > /dev/null; then
            CONFIG_CHANGES="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -E "\.md$" > /dev/null; then
            DOCS_CHANGES="true"
          fi
          
          echo "security_changes=$SECURITY_CHANGES" >> $GITHUB_OUTPUT
          echo "policy_changes=$POLICY_CHANGES" >> $GITHUB_OUTPUT
          echo "code_changes=$CODE_CHANGES" >> $GITHUB_OUTPUT
          echo "config_changes=$CONFIG_CHANGES" >> $GITHUB_OUTPUT
          echo "docs_changes=$DOCS_CHANGES" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Setup Review Environment
        run: |
          # Create comprehensive review context file
          cat > .github/review-context.md << EOF
          # Automated Review Context
          - **Trigger**: ${{ github.event_name }}
          - **Branch**: ${{ github.ref_name }}
          - **Commit**: ${{ github.sha }}
          - **Repository**: ${{ github.repository }}
          - **Date**: $(date +'%Y-%m-%d %H:%M:%S UTC')
          
          ## Change Analysis
          - **Security Changes**: ${{ steps.detect-changes.outputs.security_changes }}
          - **Policy Changes**: ${{ steps.detect-changes.outputs.policy_changes }}
          - **Code Changes**: ${{ steps.detect-changes.outputs.code_changes }}
          - **Config Changes**: ${{ steps.detect-changes.outputs.config_changes }}
          - **Documentation Changes**: ${{ steps.detect-changes.outputs.docs_changes }}
          
          ## Files Changed
          \`\`\`
          ${{ steps.detect-changes.outputs.changed_files }}
          \`\`\`
          
          ## Review Instructions
          Please perform a comprehensive code review following our established checklist:
          1. Follow \`copilot-code-review-checklist.md\` exactly
          2. Execute in READ-ONLY mode (never modify files)
          3. Use standardized output format
          4. Reference specific files/line numbers
          5. Cross-reference with documentation
          6. Check compliance with \`docs/documentation-hierarchy.md\`
          7. Verify policy supremacy is maintained
          
          ## Security Assessment Requirements
          ${{ steps.detect-changes.outputs.security_changes == 'true' && '**SECURITY REVIEW REQUIRED**' || 'Standard review' }}
          
          If security-related changes detected, perform comprehensive ISO assessment:
          1. Follow \`docs/policy/iso-assessment-checklist.md\` point by point
          2. Verify authentication architecture compliance (KrakenD-only pattern)
          3. Check personal data protection requirements
          4. Verify domain isolation patterns
          5. Document security findings with specific evidence
          6. Assess impact on compliance posture
          
          ## Policy Compliance Check
          ${{ steps.detect-changes.outputs.policy_changes == 'true' && '**POLICY REVIEW REQUIRED**' || 'Standard compliance check' }}
          
          If policy changes detected:
          1. Verify changes align with ISO 27001 requirements
          2. Check for conflicts with existing documentation
          3. Assess impact on development workflows
          4. Validate change authorization and approval
          5. Update any affected documentation references
          EOF
          
      - name: Generate Review Prompt
        id: review-prompt
        run: |
          # Create comprehensive review prompt based on change types
          REVIEW_TYPE="standard"
          SECURITY_FLAG=""
          POLICY_FLAG=""
          
          if [ "${{ steps.detect-changes.outputs.security_changes }}" = "true" ]; then
            REVIEW_TYPE="security-focused"
            SECURITY_FLAG="⚠️ **SECURITY REVIEW REQUIRED** - Authentication/authorization changes detected. "
          fi
          
          if [ "${{ steps.detect-changes.outputs.policy_changes }}" = "true" ]; then
            REVIEW_TYPE="policy-focused"
            POLICY_FLAG="🏛️ **POLICY REVIEW REQUIRED** - Policy documentation changes detected. "
          fi
          
          BRANCH_CONTEXT=""
          if [ "${{ github.ref_name }}" = "main" ]; then
            BRANCH_CONTEXT="This is a PRODUCTION branch review. Extra scrutiny required."
          elif [ "${{ github.ref_name }}" = "development" ]; then
            BRANCH_CONTEXT="This is a DEVELOPMENT branch review. Focus on compliance and patterns."
          fi
          
          PROMPT="${SECURITY_FLAG}${POLICY_FLAG}Perform a comprehensive ${REVIEW_TYPE} code review of this repository. Follow the copilot-code-review-checklist.md exactly. This is an automated review triggered by ${{ github.event_name }} on branch ${{ github.ref_name }}. ${BRANCH_CONTEXT} Assess compliance with documented standards and provide structured feedback."
          
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "review_type=$REVIEW_TYPE" >> $GITHUB_OUTPUT

      - name: Validate Repository Health
        id: validate
        run: |
          # Check for required documentation files
          HEALTH_ISSUES=""
          
          # Core documentation checks
          if [ ! -f "docs/policy/iso-security-policy.md" ]; then
            HEALTH_ISSUES="$HEALTH_ISSUES\n- Missing: docs/policy/iso-security-policy.md"
          fi
          
          if [ ! -f "docs/documentation-hierarchy.md" ]; then
            HEALTH_ISSUES="$HEALTH_ISSUES\n- Missing: docs/documentation-hierarchy.md"
          fi
          
          if [ ! -f ".github/copilot-instructions.md" ]; then
            HEALTH_ISSUES="$HEALTH_ISSUES\n- Missing: .github/copilot-instructions.md"
          fi
          
          # Policy supremacy check in key files
          if [ -f "README.md" ] || [ -f "readme.md" ]; then
            README_FILE=""
            [ -f "README.md" ] && README_FILE="README.md"
            [ -f "readme.md" ] && README_FILE="readme.md"
            
            if ! grep -q "docs/policy" "$README_FILE" 2>/dev/null; then
              HEALTH_ISSUES="$HEALTH_ISSUES\n- Warning: README should reference policy documentation"
            fi
          fi
          
          # Configuration validation
          if [ -f "config.json" ]; then
            if ! python3 -m json.tool config.json > /dev/null 2>&1; then
              HEALTH_ISSUES="$HEALTH_ISSUES\n- Error: config.json is not valid JSON"
            fi
          fi
          
          # Security pattern validation for code changes
          if [ "${{ steps.detect-changes.outputs.code_changes }}" = "true" ]; then
            # Check for potential security anti-patterns
            SECURITY_ISSUES=$(grep -r -n "jwt\|token\|auth" --include="*.cs" --include="*.js" --include="*.ts" . 2>/dev/null | grep -v "node_modules" | head -5 || true)
            if [ ! -z "$SECURITY_ISSUES" ]; then
              HEALTH_ISSUES="$HEALTH_ISSUES\n- Review needed: Authentication code detected (verify KrakenD-only pattern)"
            fi
          fi
          
          # Output results
          if [ ! -z "$HEALTH_ISSUES" ]; then
            echo "health_issues<<EOF" >> $GITHUB_OUTPUT
            echo -e "$HEALTH_ISSUES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Create Review Issue
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'development')
        run: |
          # Determine issue priority and labels based on changes and branch
          PRIORITY="normal"
          LABELS="automated-review,copilot"    
          if [ "${{ steps.detect-changes.outputs.security_changes }}" = "true" ]; then
            PRIORITY="high"
            LABELS="$LABELS,security-review,urgent"
          fi
          
          if [ "${{ steps.detect-changes.outputs.policy_changes }}" = "true" ]; then
            PRIORITY="high" 
            LABELS="$LABELS,policy-review,compliance"
          fi
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            LABELS="$LABELS,production-branch"
          elif [ "${{ github.ref_name }}" = "development" ]; then
            LABELS="$LABELS,development-branch"
          fi
          
          # Create issue title with context
          ISSUE_TITLE="🤖 Automated Code Review [${{ github.ref_name }}] - $(date +'%Y-%m-%d %H:%M')"
          if [ "${{ steps.detect-changes.outputs.security_changes }}" = "true" ]; then
            ISSUE_TITLE="🔒 SECURITY REVIEW [${{ github.ref_name }}] - $(date +'%Y-%m-%d %H:%M')"
          elif [ "${{ steps.detect-changes.outputs.policy_changes }}" = "true" ]; then
            ISSUE_TITLE="🏛️ POLICY REVIEW [${{ github.ref_name }}] - $(date +'%Y-%m-%d %H:%M')"
          fi
          
          # Add health check status to labels
          if [ "${{ steps.validate.outputs.has_issues }}" = "true" ]; then
            LABELS="$LABELS,health-issues"
          fi
          
          # Prepare health status message
          HEALTH_STATUS="✅ No critical issues detected"
          if [ "${{ steps.validate.outputs.has_issues }}" = "true" ]; then
            HEALTH_STATUS="⚠️ Repository health issues detected - see validation output"
          fi
          
          # Prepare conditional sections for issue body
          SECURITY_SECTION=""
          if [ "${{ steps.detect-changes.outputs.security_changes }}" = "true" ]; then
            SECURITY_SECTION="

          **🔒 SECURITY REVIEW REQUIRED**:
          - Follow \`docs/policy/iso-assessment-checklist.md\` point by point
          - Verify KrakenD-only authentication pattern compliance
          - Check domain isolation implementation
          - Assess personal data protection measures
          - Document findings with specific evidence"
          fi
          
          POLICY_SECTION=""
          if [ "${{ steps.detect-changes.outputs.policy_changes }}" = "true" ]; then
            POLICY_SECTION="

          **🏛️ POLICY REVIEW REQUIRED**:
          - Verify ISO 27001 compliance alignment
          - Check for documentation conflicts
          - Assess development workflow impact
          - Validate change authorization
          - Update documentation references if needed"
          fi
          
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body "## Automated Code Review Request

          **Trigger**: ${{ github.event_name }}
          **Branch**: ${{ github.ref_name }}
          **Commit**: ${{ github.sha }}
          **Review Type**: ${{ steps.review-prompt.outputs.review_type }}
          **Priority**: $PRIORITY

          ### Change Summary
          - 🔒 Security Changes: ${{ steps.detect-changes.outputs.security_changes }}
          - 🏛️ Policy Changes: ${{ steps.detect-changes.outputs.policy_changes }}
          - 💻 Code Changes: ${{ steps.detect-changes.outputs.code_changes }}
          - ⚙️ Config Changes: ${{ steps.detect-changes.outputs.config_changes }}
          - 📚 Documentation Changes: ${{ steps.detect-changes.outputs.docs_changes }}

          ### Files Changed
          \`\`\`
          ${{ steps.detect-changes.outputs.changed_files }}
          \`\`\`

          ### Repository Health Status
          $HEALTH_STATUS

          ---

          @github-copilot ${{ steps.review-prompt.outputs.prompt }}

          **Review Instructions**:
          - Execute in READ-ONLY mode (never modify files)
          - Use standardized output format from \`copilot-code-review-checklist.md\`
          - Reference specific files/line numbers for all findings
          - Cross-reference with documentation hierarchy (\`docs/documentation-hierarchy.md\`)
          - Verify policy supremacy compliance
          ${SECURITY_SECTION}
          ${POLICY_SECTION}

          **Expected Deliverables**:
          1. Compliance assessment summary
          2. Specific findings with file/line references
          3. Risk assessment (if security/policy changes)
          4. Recommendation priority levels
          5. Next steps for remediation

          **Review Scope**: Full repository compliance assessment for ${{ github.ref_name }} branch" \
            --label "$LABELS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}