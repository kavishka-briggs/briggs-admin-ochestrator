name: DEV - Build & Push Plugin to DEV

on:
    push:
        branches: ["development"]
        paths:
          - 'frontend/**'
    workflow_dispatch:
      inputs:
        branch:
          description: 'Branch to build'
          required: true
          default: 'development'

jobs:
  input-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || 'development' }}
      - name: Check for config.json
        run: |
          if [ ! -f "config.json" ]; then
            echo "config.json file not found"
            exit 1
          fi

  qa:
    needs: input-validation
    uses: briggs-walker/plugin-deploy/.github/workflows/briggs-qa.yaml@development
    with:
      branch: ${{ github.event.inputs.branch || 'development' }}
      working-directory: frontend
      trivy-scan-fs: true
      trivy-scan-image: false
      run-sonar: true
      sonar-sources: src,public,index.html,server.js,vite.config.ts,eslint.config.js,tailwind.config.js
      sonar-exclusions: '**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/*.map'
      node-version: "22"
      pre-sonar-command: |
        if grep -q '"test:coverage"' package.json; then
          npm ci
          npm run test:coverage
        fi
      sonar-additional-args: |
        -Dsonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
        -Dsonar.typescript.file.suffixes=.ts,.tsx
        -Dsonar.css.file.suffixes=.css
        -Dsonar.html.file.suffixes=.html
        -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      GH_NPM_TOKEN_CLASSIC: ${{ secrets.GH_NPM_TOKEN_CLASSIC }}

  build:
    needs:
      - input-validation
      - qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || 'development' }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read config.json
        id: read_config
        run: |
          if [ ! -f "config.json" ]; then
            echo "config.json file not found"
            exit 1
          fi

          PLUGIN_ID=$(jq -r '.plugin_id' config.json)
          IMAGE_NAME="frontend-${PLUGIN_ID}-dev"
          echo "Image Name: $IMAGE_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Configure npm for GitHub Packages
        run: |
          echo "@briggs-walker:registry=https://npm.pkg.github.com" >> ./frontend/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_NPM_TOKEN_CLASSIC }}" >> ./frontend/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_NPM_TOKEN_CLASSIC }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean up node_modules and package-lock.json
        run: |
          rm -rf ./frontend/node_modules

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build the app
        run: npm run build
        working-directory: ./frontend

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ secrets.ACR_ENDPOINT_DEV }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_ENDPOINT_DEV }}
          username: ${{ secrets.ACR_USERNAME_DEV }}
          password: ${{ secrets.ACR_PASSWORD_DEV }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.ACR_ENDPOINT_DEV }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v3
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_ENDPOINT_DEV }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_ENDPOINT_DEV }}/${{ env.IMAGE_NAME }}:development
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
